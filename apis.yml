name: Smartex
description: >-
  Smartex is an AI and computer-vision company founded in 2018 and headquartered in Porto, Portugal
  that builds hardware-enabled software for the textile manufacturing industry. Its systems inspect
  fabric in real time on the knitting machine to detect defects at the source, cutting textile waste,
  CO2 emissions, water, energy and rework. The product suite spans CORE (a machine-vision inspection
  add-on for circular knitting machines), FACT (an all-in-one digital factory-management platform for
  production visibility and quality control) and LOOP (supply-chain communication and traceability).
  Smartex is backed by Lightspeed Venture Partners, DCVC, Tony Fadell's Build Collective, H&M Group,
  SOSV/HAX, Spider Capital, Momenta Ventures and Fashion for Good. It does not currently publish a
  public developer API, SDK, or developer portal; customer access is through the FACT platform login.
  This profile was surfaced from the VC-portfolio pipeline and enriched from Smartex's public web surface.
